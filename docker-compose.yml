version: '3.8'

services:
  rms-db:
    image: postgres:16-alpine
    container_name: rms-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: railway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: RMSv3_Local_Password_2026!
    volumes:
      - rms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d railway"]
      interval: 5s
      timeout: 5s
      retries: 5

  rms-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: rms-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:RMSv3_Local_Password_2026!@rms-db:5432/railway
    depends_on:
      rms-db:
        condition: service_healthy

  rms-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rms-web
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      PORT: 3000
      NODE_ENV: production

volumes:
  rms_postgres_data:
    driver: local
